# Render Blueprint: Django API + managed PostgreSQL. The frontend deploys separately (Vercel/Netlify).
databases:
  - name: tuliwamu-db
    plan: free
    databaseName: tuliwamu
    user: tuliwamu

services:
  - type: web
    name: tuliwamu-api
    runtime: python
    rootDir: backend
    buildCommand: "./build.sh"
    startCommand: "gunicorn config.wsgi:application --bind 0.0.0.0:$PORT --workers 2 --timeout 60"
    healthCheckPath: /api/health/
    envVars:
      - key: DATABASE_URL
        fromDatabase: { name: tuliwamu-db, property: connectionString }
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: DJANGO_DEBUG
        value: "False"
      - key: DJANGO_ALLOWED_HOSTS
        value: ".onrender.com"
      - key: CORS_ALLOWED_ORIGINS
        sync: false   # e.g. https://tuliwamu.vercel.app
      - key: CSRF_TRUSTED_ORIGINS
        sync: false
      - key: FRONTEND_URL
        sync: false
      - key: FIELD_ENCRYPTION_KEY
        sync: false   # python -c "from cryptography.fernet import Fernet; print(Fernet.generate_key().decode())"
      - key: REFRESH_COOKIE_SAMESITE
        value: "None"
      - key: REFRESH_COOKIE_SECURE
        value: "True"
      - key: AFRICASTALKING_USERNAME
        value: sandbox
      - key: AFRICASTALKING_API_KEY
        sync: false
      - key: AFRICASTALKING_ENVIRONMENT
        value: sandbox
      - key: AFRICASTALKING_CALLBACK_TOKEN
        generateValue: true
      - key: PYTHON_VERSION
        value: "3.12.7"
