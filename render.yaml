# Render Blueprint — one Docker web service (React app + Django API) and a managed PostgreSQL database.
# Deploy: Render dashboard → New → Blueprint → pick this repository and branch.
databases:
  - name: tuliwamu-db
    plan: free
    databaseName: tuliwamu
    user: tuliwamu

services:
  - type: web
    name: tuliwamu
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    healthCheckPath: /api/health/
    envVars:
      - key: DATABASE_URL
        fromDatabase: { name: tuliwamu-db, property: connectionString }
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: FIELD_ENCRYPTION_KEY
        generateValue: true   # keep it: encrypted fields cannot be read without it
      - key: DJANGO_DEBUG
        value: "False"
      - key: SEED_DEMO_DATA
        value: "true"   # loads fictional demo data once, when the database is empty
      - key: REFRESH_COOKIE_SAMESITE
        value: Lax      # frontend and API share one origin
      - key: REFRESH_COOKIE_SECURE
        value: "True"
      - key: SMS_PROVIDER
        value: mock     # switch to africastalking after adding AFRICASTALKING_API_KEY
      - key: AFRICASTALKING_USERNAME
        value: sandbox
      - key: AFRICASTALKING_ENVIRONMENT
        value: sandbox
      - key: AFRICASTALKING_CALLBACK_TOKEN
        generateValue: true
